<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오늘별 — 오늘 밤하늘 관측 정보</title>
<meta name="description" content="내 위치의 월령, 일출·일몰, 천문박명, 오늘 밤 관측 시간을 한눈에.">
<meta property="og:title" content="오늘별">
<meta property="og:description" content="오늘 밤하늘, 얼마나 어두울까? 월령·일출일몰·천문박명을 한눈에.">
<meta property="og:image" content="https://todaystar.vercel.app/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-star">✦</span> 오늘별
  </div>
  <button id="btn-locate" class="loc-chip" title="위치 다시 잡기">
    <span id="loc-name">위치 확인 중…</span>
  </button>
</header>

<main id="view-today">
<nav class="datenav">
  <button id="btn-prev" aria-label="이전 날">◀</button>
  <div class="datenav-center">
    <div id="date-label" class="date-label">—</div>
    <button id="btn-today" class="btn-today hidden">오늘로</button>
  </div>
  <button id="btn-next" aria-label="다음 날">▶</button>
</nav>

  <!-- 오늘 밤 관측 시간 -->
  <section class="card card-hero">
    <div class="card-title">이 밤의 완전한 어둠 <span class="sub">(천문박명 끝 ~ 시작)</span></div>
    <div id="dark-window" class="hero-time">—</div>
    <div id="dark-length" class="hero-sub">—</div>
    <div id="obs-badge" class="badge hidden"></div>
  </section>

  <!-- 달 -->
  <section class="card card-moon">
    <canvas id="moon-canvas" width="140" height="140"></canvas>
    <div class="moon-info">
      <div class="card-title">달</div>
      <div id="moon-phase-name" class="big">—</div>
      <div id="moon-detail" class="detail">—</div>
      <div id="moon-times" class="detail">—</div>
    </div>
  </section>

  <!-- 해 / 박명 -->
  <div class="grid2">
    <section class="card">
      <div class="card-title">해</div>
      <div class="row"><span>일출</span><b id="sunrise">—</b></div>
      <div class="row"><span>일몰</span><b id="sunset">—</b></div>
    </section>
    <section class="card">
      <div class="card-title">저녁 박명 <span class="sub">어두워지는 순서</span></div>
      <div class="row"><span>시민박명 끝</span><b id="dusk-civil">—</b></div>
      <div class="row"><span>항해박명 끝</span><b id="dusk-nautical">—</b></div>
      <div class="row"><span>천문박명 끝</span><b id="dusk-astro">—</b></div>
    </section>
  </div>

  <div class="grid2">
    <section class="card">
      <div class="card-title">새벽 박명 <span class="sub">밝아지는 순서</span></div>
      <div class="row"><span>천문박명 시작</span><b id="dawn-astro">—</b></div>
      <div class="row"><span>항해박명 시작</span><b id="dawn-nautical">—</b></div>
      <div class="row"><span>시민박명 시작</span><b id="dawn-civil">—</b></div>
    </section>
    <section class="card">
      <div class="card-title">한 주 미리보기</div>
      <div id="week-list" class="week-list"></div>
    </section>
  </div>
</main>

<section id="view-targets" class="hidden">
  <div class="hours-bar">
    <span class="hours-label">촬영 시간</span>
    <select id="hour-start">
      <option value="">어두워지면</option>
      <option value="18">저녁 6시</option><option value="19">저녁 7시</option>
      <option value="20">저녁 8시</option><option value="21">밤 9시</option>
      <option value="22">밤 10시</option><option value="23">밤 11시</option>
      <option value="0">자정</option><option value="1">새벽 1시</option>
      <option value="2">새벽 2시</option>
    </select>
    <span class="hours-sep">→</span>
    <select id="hour-end">
      <option value="">새벽까지</option>
      <option value="21">밤 9시</option><option value="22">밤 10시</option>
      <option value="23">밤 11시</option><option value="0">자정</option>
      <option value="1">새벽 1시</option><option value="2">새벽 2시</option>
      <option value="3">새벽 3시</option><option value="4">새벽 4시</option>
      <option value="5">새벽 5시</option>
    </select>
  </div>
  <div class="search-wrap">
    <input id="target-search" type="search" inputmode="search" placeholder="M31, NGC 7000, 안드로메다…" autocomplete="off">
  </div>
  <div id="target-detail" class="hidden"></div>
  <div id="target-list"></div>
</section>

<section id="view-spots" class="hidden">
  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-btns">
      <button id="btn-me" title="내 위치로">📍</button>
      <button id="btn-3d" title="3D 지형">3D</button>
      <button id="btn-lp" class="on" title="광해 켜기/끄기">광해</button>
    </div>
    <div id="spot-card" class="hidden"></div>
  </div>
  <div class="map-hint">지도를 누르면 그 지점의 밤하늘 어두운 정도를 알려드려요</div>
</section>

<footer>
  <span id="coords" class="coords">—</span>
  <span class="credit">오늘별 · 계산은 기기에서 직접 합니다</span>
</footer>

<nav class="tabbar">
  <button data-view="today" class="active">오늘</button>
  <button data-view="targets">대상</button>
  <button data-view="spots">관측지</button>
</nav>

<script src="suncalc.js"></script>
<script src="maplibre-gl.js"></script>
<script src="app.js"></script>
<script src="targets.js"></script>
<script src="spots.js"></script>
</body>
</html>
